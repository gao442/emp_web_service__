<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>员工管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="header">
    <h1>员工管理系统</h1>
    <a onclick="logout()">退出登录</a>
</div>

<div class="tabs">
    <div class="tab active" id="tabEmp" onclick="switchTab('emp')">员工管理</div>
    <div class="tab" id="tabDept" onclick="switchTab('dept')">部门管理</div>
</div>

<!-- ==================== 员工管理 ==================== -->
<div class="container" id="empPanel">
    <div class="toolbar">
        <button onclick="openEmpModal()">+ 新增员工</button>
        <button class="danger" onclick="batchDelete()">批量删除</button>
        <input type="text" id="qName" placeholder="姓名">
        <select id="qGender">
            <option value="">性别(不限)</option>
            <option value="1">男</option>
            <option value="2">女</option>
        </select>
        <input type="date" id="qEntrydate">
        <button class="gray" onclick="searchEmp(1)">查询</button>
    </div>
    <table>
        <thead>
        <tr>
            <th><input type="checkbox" id="checkAll" onclick="toggleAll(this)"></th>
            <th>头像</th><th>姓名</th><th>昵称</th><th>性别</th><th>职业编号</th>
            <th>入职时间</th><th>部门</th><th>操作</th>
        </tr>
        </thead>
        <tbody id="empBody"></tbody>
    </table>
    <div class="pagination">
        <span id="pageInfo"></span>
        <button class="small gray" onclick="searchEmp(state.page-1)">上一页</button>
        <button class="small gray" onclick="searchEmp(state.page+1)">下一页</button>
        <select id="pageSizeSel" onchange="state.pageSize=+this.value; searchEmp(1)">
            <option value="5">5条/页</option>
            <option value="10" selected>10条/页</option>
            <option value="20">20条/页</option>
        </select>
    </div>
</div>

<!-- ==================== 部门管理 ==================== -->
<div class="container hidden" id="deptPanel">
    <div class="toolbar">
        <button onclick="openDeptModal()">+ 新增部门</button>
    </div>
    <table>
        <thead><tr><th>序号</th><th>部门名称</th><th>创建时间</th><th>操作</th></tr></thead>
        <tbody id="deptBody"></tbody>
    </table>
</div>

<!-- ==================== 员工弹窗 ==================== -->
<div class="modal-mask" id="empMask">
    <div class="modal">
        <h3 id="empModalTitle">新增员工</h3>
        <input type="hidden" id="eId">
        <div class="form-item"><label>用户名</label><input id="eUsername"></div>
        <div class="form-item"><label>密码</label><input id="ePassword" type="password" placeholder="新增必填，编辑留空表示不修改"></div>
        <div class="form-item"><label>姓名</label><input id="eName"></div>
        <div class="form-item"><label>性别</label>
            <select id="eGender"><option value="1">男</option><option value="2">女</option></select>
        </div>
        <div class="form-item"><label>职业编号</label><input id="eJob" type="number" value="1"></div>
        <div class="form-item"><label>入职时间</label><input id="eEntrydate" type="date"></div>
        <div class="form-item"><label>部门</label><select id="eDept"></select></div>
        <div class="form-item"><label>头像</label>
            <input type="file" id="eImageFile" accept="image/*" onchange="uploadImage(this)">
            <img id="eImagePreview" class="avatar" style="margin-top:6px" src=""><br>
            <input type="hidden" id="eImage">
        </div>
        <div class="modal-footer">
            <button class="gray" onclick="closeModal('empMask')">取消</button>
            <button onclick="saveEmp()">保存</button>
        </div>
    </div>
</div>

<!-- ==================== 部门弹窗 ==================== -->
<div class="modal-mask" id="deptMask">
    <div class="modal">
        <h3 id="deptModalTitle">新增部门</h3>
        <input type="hidden" id="dId">
        <div class="form-item"><label>部门名称</label><input id="dName"></div>
        <div class="modal-footer">
            <button class="gray" onclick="closeModal('deptMask')">取消</button>
            <button onclick="saveDept()">保存</button>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script src="js/manage.js"></script>
</body>
</html>
